[pytest]
# ---------------------------------------------------------------------------
# Shopper Spectrum — pytest configuration
# ---------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output verbosity
addopts =
    --tb=short
    -v
    --strict-markers
    --color=yes

# Custom markers
markers =
    unit:        Pure unit tests — no I/O, no models/ required
    integration: Integration tests — artifact round-trips
    system:      System tests — full pipeline scenarios
    acceptance:  Acceptance tests — SRS acceptance criteria
    slow:        Tests that take >2s (excluded from fast runs with -m "not slow")
    kaggle:      Tests that require a live Kaggle connection
    nfr:         Non-functional requirement tests (performance, security, scale)

# Minimum version requirement
minversion = 7.0
