services:
  - type: web
    name: shopper-spectrum
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: KAGGLE_API_TOKEN
        sync: false          # Set this secret in the Render dashboard — never commit the value
